<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>第 1 屏 · 风格 B · 号外头版</title>
  </head>
  <body>
    <template>
      <style>
        /* 站酷庆科黄油体（ZCOOL QingKe HuangYou），SIL OFL 1.1，已子集化为文案用字，许可见 assets/fonts/OFL.txt */
        @font-face {
          font-family: "ZCOOL QingKe HuangYou";
          src: url("assets/fonts/ZCOOLQingKeHuangYou-subset.woff2") format("woff2");
          font-weight: 400;
          font-display: block;
        }
        #screen-01 {
          --signal: #ffd60a;
          --ink: #15130f;
          --vermilion: #c8261a;
          --cream: #fff6d6;
          position: absolute;
          inset: 0;
          overflow: hidden;
          background: var(--ink);
          font-family: "ZCOOL QingKe HuangYou", sans-serif;
          color: var(--ink);
        }
        #screen-01 * {
          margin: 0;
          padding: 0;
          box-sizing: border-box;
        }
        /* 图片：满屏，不调色；动效只用缩放 */
        .map-zoom {
          position: absolute;
          inset: 0;
          transform-origin: 38% 40%;
        }
        .map-zoom img {
          display: block;
          width: 1920px;
          height: 1080px;
          object-fit: cover;
        }
        /* 标题牌：左上角，报纸号外的黄底黑字 */
        .panel {
          position: absolute;
          left: 96px;
          top: 96px;
          padding: 34px 52px 46px;
          background: var(--signal);
          box-shadow: 0 16px 0 rgba(21, 19, 15, 0.9);
        }
        .question {
          font-size: 104px;
          font-weight: 400;
          line-height: 1.14;
          letter-spacing: 0.01em;
        }
        .line {
          display: block;
          white-space: nowrap;
        }
        .chip {
          display: inline-block;
          margin-right: 18px;
          padding: 0 16px;
          background: var(--vermilion);
          color: var(--cream);
        }
        .slam {
          display: inline-block;
        }
        .panel-rule {
          position: absolute;
          left: 0;
          right: 0;
          bottom: -40px;
          height: 16px;
          background: var(--ink);
          transform-origin: 0% 50%;
        }
        /* 底部报头横线：黑色粗线 + 一段朱红 */
        .footer-rule {
          position: absolute;
          left: 96px;
          right: 96px;
          bottom: 96px;
          height: 16px;
          display: flex;
        }
        .footer-rule .red {
          display: block;
          width: 220px;
          height: 100%;
          background: var(--vermilion);
          transform-origin: 0% 50%;
        }
        .footer-rule .bar {
          display: block;
          flex: 1;
          height: 100%;
          background: var(--signal);
          transform-origin: 0% 50%;
        }
      </style>

      <div id="screen-01" data-composition-id="screen-01" data-width="1920" data-height="1080">
        <div class="map-zoom" id="map-zoom" data-layout-allow-overflow>
          <img id="crater" src="assets/images/crater_nasa.jpg" alt="" />
        </div>

        <div class="panel" id="panel" data-layout-allow-overflow>
          <h1 class="question">
            <span class="line line-1" id="l1"><span class="chip">猜：</span>小行星撞地球那场大灭绝，</span>
            <span class="line line-2"><span class="slam" id="l2">是多少年前？</span></span>
          </h1>
          <div class="panel-rule" id="panel-rule"></div>
        </div>

        <div class="footer-rule" aria-hidden="true">
          <span class="red" id="rule-red"></span><span class="bar" id="rule-black"></span>
        </div>
      </div>

      <script>
        const tl = gsap.timeline({ paused: true });
        // kinetic-beat-slam：一条节拍网格驱动所有入场，每句入场方式不同
        const PULSE = 0.35;
        const BEATS = [PULSE * 1, PULSE * 2, PULSE * 3, PULSE * 4];

        // 地图：先推近、再在第一拍拉回全景（coordinate-target-zoom 的反向用法）
        tl.fromTo("#map-zoom", { scale: 1.22 }, { scale: 1, duration: 0.9, ease: "power3.out" }, 0);

        // 拍 1：标题牌从左侧硬切进画面（side snap）
        tl.fromTo("#panel", { x: -1200 }, { x: 0, duration: 0.42, ease: "expo.out" }, BEATS[0]);
        // 拍 2：第一行砸进（scale + blur slam）
        tl.fromTo(
          "#l1",
          { scale: 1.45, filter: "blur(14px)", opacity: 0 },
          { scale: 1, filter: "blur(0px)", opacity: 1, duration: 0.4, ease: "power4.out" },
          BEATS[1],
        );
        // 拍 3：第二行侧向弹入（rise + rotate）
        tl.fromTo(
          "#l2",
          { y: 90, rotation: 5, opacity: 0 },
          { y: 0, rotation: 0, opacity: 1, duration: 0.38, ease: "expo.out" },
          BEATS[2],
        );
        // 拍 4：报纸粗线划出
        tl.fromTo("#panel-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: "power3.out" }, BEATS[3]);
        tl.fromTo("#rule-red", { scaleX: 0 }, { scaleX: 1, duration: 0.25, ease: "power3.out" }, BEATS[3]);
        tl.fromTo("#rule-black", { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "power3.out" }, BEATS[3] + 0.08);

        window.__timelines["screen-01"] = tl;
      </script>
    </template>
  </body>
</html>
