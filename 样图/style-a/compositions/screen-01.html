<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>第 1 屏 · 风格 A · 野外记录本</title>
  </head>
  <body>
    <template>
      <style>
      /* 思源宋体（Noto Serif SC），SIL OFL 1.1，已子集化为文案用字，许可见 assets/fonts/OFL.txt */
      @font-face {
        font-family: "Noto Serif SC";
        src: url("assets/fonts/NotoSerifSC-subset.woff2") format("woff2");
        font-weight: 200 900;
        font-display: block;
      }
      #screen-01 {
        --paper: #f1ebdd;
        --ink: #23201a;
        --rust: #9a3412;
        --tape: rgba(216, 195, 154, 0.88);
        --card: #fbf8f1;
      }
      #screen-01 {
        position: absolute;
        inset: 0;
        overflow: hidden;
        background: var(--paper);
        font-family: "Noto Serif SC", serif;
        color: var(--ink);
      }
      #screen-01 * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      /* 背景：纸张横格线 */
      .ruled {
        position: absolute;
        inset: 0;
        background-image: repeating-linear-gradient(
          to bottom,
          transparent 0,
          transparent 53px,
          rgba(35, 32, 26, 0.13) 53px,
          rgba(35, 32, 26, 0.13) 55px
        );
      }
      /* 活页孔：左侧边缘，强调“笔记本”质感 */
      .holes {
        position: absolute;
        left: 34px;
        top: 0;
        bottom: 0;
        display: flex;
        flex-direction: column;
        justify-content: space-around;
        padding: 150px 0;
      }
      .holes i {
        display: block;
        width: 38px;
        height: 38px;
        border-radius: 50%;
        background: #d9d1bf;
        box-shadow: inset 0 3px 6px rgba(35, 32, 26, 0.35);
      }
      /* 照片：右上角，像贴在本子上的冲印照片 */
      .photo-tilt {
        position: absolute;
        right: 120px;
        top: 112px;
        width: 860px;
        transform: rotate(2.2deg);
      }
      .photo-card {
        display: block;
        width: 100%;
        padding: 20px;
        background: var(--card);
        box-shadow: 0 18px 44px rgba(35, 32, 26, 0.28);
        transform-origin: 50% 0%;
      }
      .photo-card img {
        display: block;
        width: 820px;
        height: 461px;
        object-fit: cover;
      }
      .tape {
        position: absolute;
        top: -22px;
        width: 168px;
        height: 46px;
      }
      .tape.left {
        left: 40px;
        transform: rotate(-7deg);
      }
      .tape.right {
        right: 40px;
        transform: rotate(6deg);
      }
      .tape-fill {
        display: block;
        width: 100%;
        height: 100%;
        background: var(--tape);
        transform-origin: 0% 50%;
      }
      /* 文字：左下角，左对齐 */
      .question {
        position: absolute;
        left: 120px;
        bottom: 118px;
        font-size: 100px;
        font-weight: 900;
        line-height: 1.2;
        letter-spacing: -0.02em;
      }
      .line {
        display: block;
        white-space: nowrap;
      }
      .word {
        display: inline-block;
        opacity: 0; /* waterfall-entry：入场时由 tl.set 二值切到 1 */
      }
      .guess {
        color: var(--rust);
      }
      .underline {
        position: absolute;
        left: -6px;
        bottom: -30px;
        width: 620px;
        height: 44px;
        overflow: visible;
      }
      .underline path {
        visibility: hidden;
        fill: none;
        stroke: var(--rust);
        stroke-width: 9;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .line-2 {
        position: relative;
      }
          </style>

      <div id="screen-01" data-composition-id="screen-01" data-width="1920" data-height="1080">
        <div class="ruled"></div>
        <div class="holes" aria-hidden="true"><i></i><i></i><i></i></div>

        <div class="photo-tilt">
          <div class="photo-card" id="photo-card">
            <img id="crater" src="assets/images/crater_nasa.jpg" alt="" />
            <div class="tape left"><span class="tape-fill" id="tape-left"></span></div>
            <div class="tape right"><span class="tape-fill" id="tape-right"></span></div>
          </div>
        </div>

        <h1 class="question" id="question">
          <span class="line line-1"><span class="word guess" id="w1">猜：</span><span class="word" id="w2">小行星撞地球</span><span class="word" id="w3">那场大灭绝，</span></span>
          <span class="line line-2"><span class="word" id="w4">是多少年前？</span>
            <svg class="underline" viewBox="0 0 620 44" aria-hidden="true">
              <path id="underline-path" d="M 8 30 C 130 18, 260 36, 390 24 S 560 20, 612 28" />
            </svg>
          </span>
        </h1>
      
      </div>

      <script>
      const tl = gsap.timeline({ paused: true });
      const F = 1 / 30;

      // 照片：spring-pop-entrance（Origin-anchored pop，calm settle，power3.out，无回弹）
      tl.fromTo(
        "#photo-card",
        { scale: 0, opacity: 0, y: 12 },
        { scale: 1, opacity: 1, y: 0, duration: 0.6, ease: "power3.out" },
        0.15,
      );
      // 胶带：同一节拍里按顺序贴上
      tl.fromTo("#tape-left", { scaleX: 0 }, { scaleX: 1, duration: 0.25, ease: "power3.out" }, 0.6);
      tl.fromTo("#tape-right", { scaleX: 0 }, { scaleX: 1, duration: 0.25, ease: "power3.out" }, 0.68);

      // 文字：waterfall-entry（透明度用 tl.set 二值切换，不做淡入）
      let t = 0.75;
      [
        ["#w1", 80, 0.2],
        ["#w2", 50, 0.16],
        ["#w3", 45, 0.15],
        ["#w4", 70, 0.18],
      ].forEach(([sel, dy, dur]) => {
        tl.set(sel, { opacity: 1, y: dy }, t);
        tl.to(sel, { y: 0, duration: dur, ease: "power4.out" }, t);
        t += dur - F;
      });

      // 下划线：svg-path-draw（匀速笔迹）
      const path = document.getElementById("underline-path");
      const len = path.getTotalLength();
      path.style.strokeDasharray = `${len}`;
      // 开画前整条线隐藏（二值切换），避免圆头线帽在起点留下一个小点
      tl.set(path, { visibility: "visible" }, t + 0.05);
      tl.fromTo(path, { strokeDashoffset: len }, { strokeDashoffset: 0, duration: 0.5, ease: "none" }, t + 0.05);

      window.__timelines["screen-01"] = tl;
          </script>
    </template>
  </body>
</html>
