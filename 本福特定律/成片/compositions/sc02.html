    <template>
      <style>

        #t-kicker .seal {
          width: 40px;

          border-radius: 50%;
          border: 1.5px solid rgba(216, 180, 106, 0.85);

        #t-title {
          margin-top: 38px;
          font: 700 176px/1.1 "Noto Serif SC", serif;

          white-space: nowrap;
        }
        #t-title span {
          display: inline-block;
          background: linear-gradient(100deg, #e3c88f 0%, #f4e1b2 30%, #e7cf98 40%, #fffbe9 47%, #ffffff 50%, #fffbe9 53%, #e7cf98 60%, #f4e1b2 70%, #e3c88f 100%);
          background-size: 320% 100%;
          background-position: 100% 0;
          -webkit-background-clip: text;
          background-clip: text;

        #t-rule {

        #t-sparks i {
          position: absolute;

      </style>

      <div id="sc02-root" data-composition-id="sc02" data-width="1920" data-height="1080">
        <div id="t-ghost" data-layout-ignore="true" aria-hidden="true">1</div>
        <div id="t-flash"></div>
        <div id="t-sparks"></div>
        <div id="t-block">
          <div id="t-kicker"><span class="seal">1</span><span>Vibe知识大赏</span></div>
          <div id="t-title"><span>偏</span><span>心</span><span>的</span><span>数</span><span>字</span></div>
          <div id="t-rule"></div>
          <div id="t-en">THE LOPSIDED DIGITS</div>
        </div>
      </div>

      <script>
        (function () {
          const T = 60 / 102.4;
          const B0 = 32;
          const at = (b) => (b - B0) * T;
          const prand = (n) => {
            const x = Math.sin(n * 127.1 + 311.7) * 43758.5453;
            return x - Math.floor(x);
          };
          const tl = gsap.timeline({ paused: true });
          // 接住上一屏“穿过 1”：巨大的 1 从放大状态落回背景
          tl.fromTo("#t-ghost", { opacity: 0, scale: 1.6, filter: "blur(16px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 1.1, ease: "power3.out" }, 0);
          tl.fromTo("#t-flash", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1.15, duration: 0.25, ease: "power2.out" }, 0.05);
          tl.to("#t-flash", { opacity: 0, duration: 1.4, ease: "power2.out" }, 0.3);
          // 火花：从标题中心向外散开（纯函数，seek 安全）
          const sparks = document.getElementById("t-sparks");
          const NS = 30;
          for (let i = 0; i < NS; i++) sparks.appendChild(document.createElement("i"));
          const drive = { T: 0 };
          const els = sparks.querySelectorAll("i");
          const FL = 1.3;
          tl.to(drive, {
            T: 1, duration: FL, ease: "none",
            onUpdate: () => {
              const t = drive.T * FL;
              els.forEach((el, i) => {
                const ang = prand(i * 3.7) * Math.PI * 2;
                const sp = 260 + prand(i * 5.1) * 520;
                const x = Math.cos(ang) * sp * t * (1 - 0.35 * drive.T);
                const y = Math.sin(ang) * sp * t * 0.55 * (1 - 0.35 * drive.T);
                const a = drive.T === 0 ? 0 : Math.max(0, 1 - drive.T) * (0.6 + prand(i) * 0.4);
                el.style.transform = "translate(" + x.toFixed(1) + "px," + y.toFixed(1) + "px) scale(" + (0.5 + prand(i * 9) * 0.8).toFixed(2) + ")";
                el.style.opacity = a.toFixed(3);
              });
            },
          }, 0.12);

          tl.fromTo("#t-kicker", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.15);
          tl.fromTo("#t-title span", { opacity: 0, y: 40, filter: "blur(14px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.9, ease: "power3.out", stagger: 0.07 }, 0.1);
          tl.fromTo("#t-rule", { scaleX: 0 }, { scaleX: 1, duration: 1.0, ease: "power3.inOut" }, at(33));
          tl.fromTo("#t-en", { opacity: 0, y: 10, filter: "blur(6px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 1.1, ease: "power3.out" }, at(33));
          // 金属扫光
          tl.fromTo("#t-title span", { backgroundPosition: "100% 0" }, { backgroundPosition: "0% 0", duration: 1.6, ease: "power2.inOut", stagger: 0.05 }, at(34));
          // 停留：整组极慢推近
          tl.fromTo("#t-block", { scale: 1 }, { scale: 1.03, duration: at(40), ease: "none" }, 0);
          // 离场
          tl.to(["#t-block", "#t-ghost"], { opacity: 0, filter: "blur(10px)", duration: 0.5, ease: "power2.in" }, at(40) - 0.1);
          window.__timelines["sc02"] = tl;
        })();
      </script>
    </template>
  </body>
