      <script>
        (function () {
          const T = 60 / 102.4;
          const B0 = 64;
          const at = (b) => (b - B0) * T;
          const prand = (n) => {
            const x = Math.sin(n * 127.1 + 311.7) * 43758.5453;
            return x - Math.floor(x);
          };
          const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
          const ease3 = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
          const BEN = [30.1, 17.6, 12.5, 9.7, 7.9, 6.7, 5.8, 5.1, 4.6];
          const PX = 13.2; // 每 1% 的柱高
          const BAR_X = (d) => 60 + (d - 1) * 90; // 相对 #b-bars
          const BASE_Y = 300 + 520 - 60; // 底线的屏幕 y

          // 本福特 1938 年用的 20 类数据里挑 8 类（中文 + 原文）
          const DS = [["河流面积", "RIVERS, AREA"], ["人口", "POPULATION"], ["物理常数", "CONSTANTS"], ["报纸上的数", "NEWSPAPERS"],
                      ["分子量", "MOLECULAR WT."], ["原子量", "ATOMIC WEIGHT"], ["门牌地址", "ADDRESSES"], ["死亡率", "DEATH RATE"]];
          const ring = document.getElementById("b-ring");
          DS.forEach(([zh, en], i) => {
            const el = document.createElement("div");
            el.className = "ds";
            el.style.transform = "rotateY(" + i * 45 + "deg) translateZ(520px)";
            el.innerHTML = '<div class="ds-in" id="ds-' + i + '"><b>' + zh + "</b><span>" + en + "</span></div>";
            ring.appendChild(el);
          });
          const bars = document.getElementById("b-bars");
          BEN.forEach((v, k) => {
            const d = k + 1;
            const el = document.createElement("div");
            el.className = "bar";
            el.id = "bar-" + d;
            el.style.left = BAR_X(d) + "px";
            const h = v * PX;
            el.innerHTML = '<i style="height:' + h.toFixed(1) + 'px"></i><span class="v" style="bottom:' + (h + 12).toFixed(1) + 'px">' + v.toFixed(1) + '%</span><span class="d">' + d + "</span>";
            bars.appendChild(el);
          });
          // 曲线：柱顶连线（真实的 log10(1+1/d)，路径已写在 SVG 里）

          // 粒子流：从转盘中心流进九根柱，数量按本福特比例分配
          const cv = document.getElementById("b-flow");
          const ctx = cv.getContext("2d");
          const NP = 220;
          const PP = [];
          for (let i = 0; i < NP; i++) {
            const u = prand(i * 2.3);
            let acc = 0, d = 9;
            for (let k = 0; k < 9; k++) {
              acc += BEN[k] / 100;
              if (u <= acc) {
                d = k + 1;
                break;
              }
            }
            PP.push({ d, delay: prand(i * 4.1) * 2.6, sx: 960 + (prand(i * 6.7) - 0.5) * 360, sy: 470 + (prand(i * 8.3) - 0.5) * 160, bend: (prand(i * 9.9) - 0.5) * 300 });
          }
          const FLOW0 = at(72);
          function drawFlow(t) {
            ctx.clearRect(0, 0, 1920, 1080);
            const lt = t - FLOW0;
            if (lt <= 0 || lt > 5) return;
            ctx.fillStyle = "#f7e7bc";
            for (const p of PP) {
              const u = clamp((lt - p.delay) / 1.25, 0, 1);
              if (u <= 0 || u >= 1) continue;
              const e = ease3(u);
              const tx = 300 + BAR_X(p.d), ty = BASE_Y - BEN[p.d - 1] * PX;
              const x = p.sx + (tx - p.sx) * e + Math.sin(e * Math.PI) * p.bend * 0.4;
              const y = p.sy + (ty - p.sy) * e - Math.sin(e * Math.PI) * 120;
              ctx.globalAlpha = Math.sin(u * Math.PI) * 0.9;
              ctx.beginPath();
              ctx.arc(x, y, 2.4, 0, Math.PI * 2);
              ctx.fill();
            }
            ctx.globalAlpha = 1;
          }

          const tl = gsap.timeline({ paused: true });
          const SCENE = at(96) + 0.4;
          const drive = { t: 0 };
          tl.to(drive, { t: SCENE, duration: SCENE, ease: "none", onUpdate: () => drawFlow(drive.t) }, 0);

          // —— 1938 ——
          tl.fromTo("#b-block", { opacity: 0, x: -24, filter: "blur(10px)" }, { opacity: 1, x: 0, filter: "blur(0px)", duration: 0.9, ease: "power3.out" }, 0.1);
          // 转盘：卡片依次出现，整体缓慢旋转
          tl.fromTo("#b-ring", { rotationY: 0, rotationX: -8 }, { rotationY: -150, rotationX: -8, duration: at(73), ease: "none" }, 0);
          for (let i = 0; i < 8; i++) {
            tl.fromTo("#ds-" + i, { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.6, ease: "power3.out" }, at(65) + i * 0.18);
          }
          // 计数：约 2 万
          tl.fromTo("#b-count", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, at(66));
          const cnt = { v: 0 };
          tl.to(cnt, { v: 20000, duration: 3.2, ease: "power2.out", onUpdate: () => {
            document.getElementById("b-num").textContent = cnt.v >= 19990 ? "2 万" : Math.round(cnt.v).toLocaleString("en-US");
          } }, at(66.5));
          // 收拢：卡片缩向中心，化成粒子流进柱子
          tl.to(".ds-in", { scale: 0.2, opacity: 0, duration: 0.8, ease: "power3.in", stagger: 0.05 }, at(71.5));
          tl.to("#b-count", { opacity: 0, duration: 0.5, ease: "power2.in" }, at(71.5));
          tl.to("#b-block", { opacity: 0.32, scale: 0.8, duration: 1.0, ease: "power2.inOut" }, at(72));
          tl.fromTo("#b-axis", { scaleX: 0 }, { scaleX: 1, duration: 0.9, ease: "power3.inOut" }, at(72));
          BEN.forEach((v, k) => {
            const d = k + 1;
            tl.fromTo("#bar-" + d + " i", { scaleY: 0 }, { scaleY: 1, duration: 2.2, ease: "power2.out" }, at(72.5) + k * 0.12);
            tl.fromTo("#bar-" + d + " .d", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, at(72.5) + k * 0.12);
            tl.fromTo("#bar-" + d + " .v", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, at(76) + k * 0.1);
          });
          // 曲线描出来
          const cp = document.getElementById("b-curve-path");
          const L = cp.getTotalLength();
          cp.style.strokeDasharray = L + "";
          tl.set(cp, { visibility: "visible" }, at(77));
          tl.fromTo(cp, { strokeDashoffset: L }, { strokeDashoffset: 0, duration: 1.6, ease: "power2.inOut" }, at(77));
          // 命名 + 公式
          tl.fromTo("#b-name", { opacity: 0, y: 16, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.9, ease: "power3.out" }, at(78));
          tl.fromTo("#b-formula", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" }, at(80));
          // —— 揭晓 Q1：C · 30.1% ——
          tl.to(["#b-name", "#b-formula"], { opacity: 0, y: -14, filter: "blur(6px)", duration: 0.45, ease: "power2.in" }, at(81.5));
          tl.fromTo("#b-chip", { opacity: 0, y: -10 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, at(82));
          tl.fromTo("#b-big", { opacity: 0, scale: 1.25, filter: "blur(14px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.7, ease: "power3.out" }, at(82));
          const big = { v: 0 };
          tl.to(big, { v: 30.1, duration: 1.1, ease: "power3.out", onUpdate: () => {
            document.getElementById("b-big-num").textContent = big.v.toFixed(1);
          } }, at(82));
          tl.fromTo("#b-big-cap", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, at(83));
          tl.to("#bar-1 i", { boxShadow: "0 0 60px rgba(247,231,188,0.85)", duration: 0.5, ease: "power2.out" }, at(82));
          tl.to(["#bar-2 i", "#bar-3 i", "#bar-4 i", "#bar-5 i", "#bar-6 i", "#bar-7 i", "#bar-8 i", "#bar-9 i"], { opacity: 0.55, duration: 0.6, ease: "power2.out" }, at(82));
          // 9 只有 4.6%
          tl.to("#bar-9 i", { opacity: 1, duration: 0.5, ease: "power2.out" }, at(88));
          tl.fromTo("#b-nine", { opacity: 0, x: 12 }, { opacity: 1, x: 0, duration: 0.7, ease: "power3.out" }, at(88));
          // 停留时整组慢推
          tl.fromTo("#sc04-all", { scale: 1 }, { scale: 1.025, duration: SCENE, ease: "none" }, 0);
          // 离场
          tl.to("#sc04-all", { opacity: 0, filter: "blur(10px)", duration: 0.45, ease: "power2.in" }, at(96) - 0.05);
          drawFlow(0);
          window.__timelines["sc04"] = tl;
        })();
      </script>
