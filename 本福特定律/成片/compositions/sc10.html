<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>S11 一把筛子</title>
  </head>
  <body>
    <template>
      <style>
/* FONTS:BEGIN */
@font-face { font-family: "Noto Serif SC"; font-weight: 200 900; font-style: normal; font-display: block; src: url("assets/fonts/noto-serif-sc-film.woff2") format("woff2"); }
/* FONTS:END */
        #sc10-root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          color: #f3eee3;
        }
        #sc10-all {
          position: absolute;
          inset: 0;
        }
        .name-card {
          position: absolute;
          left: 0;
          width: 1920px;
          top: 112px;
          text-align: center;
          opacity: 0;
        }
        .name-card .zh {
          font: 600 54px/1.1 "Noto Serif SC", serif;
          letter-spacing: 0.14em;
        }
        .name-card .en {
          margin-top: 14px;
          display: flex;
          align-items: center;
          justify-content: center;
          gap: 18px;
          font: 600 20px/1 "Cormorant Garamond", serif;
          letter-spacing: 0.32em;
          color: rgba(243, 238, 227, 0.66);
        }
        .name-card .en i {
          display: block;
          width: 60px;
          height: 1px;
          background: rgba(216, 180, 106, 0.8);
        }
        #s-sieve {
          position: absolute;
          left: 250px;
          top: 290px;
          width: 480px;
          height: 480px;
          opacity: 0;
        }
        #s-mesh {
          position: absolute;
          inset: 0;
          width: 480px;
          height: 480px;
          overflow: visible;
        }
        #s-mesh line {
          stroke: rgba(216, 180, 106, 0.35);
          stroke-width: 1.2;
        }
        #s-mesh circle {
          fill: none;
          stroke: rgba(242, 217, 153, 0.85);
          stroke-width: 2.5;
        }
        #s-rain {
          position: absolute;
          left: 250px;
          top: 160px;
          width: 480px;
          height: 760px;
        }
        #s-list {
          position: absolute;
          left: 860px;
          top: 300px;
          width: 900px;
        }
        .step {
          display: flex;
          align-items: baseline;
          gap: 26px;
          margin-bottom: 40px;
          opacity: 0;
        }
        .step .no {
          flex: none;
          width: 56px;
          height: 56px;
          border-radius: 50%;
          border: 1.5px solid #d8b46a;
          display: flex;
          align-items: center;
          justify-content: center;
          font: 700 30px/1 "Playfair Display", serif;
          color: #f2d999;
          transform: translateY(6px);
        }
        .step .tx {
          font: 600 40px/1.35 "Noto Serif SC", serif;
          letter-spacing: 0.04em;
        }
        .step .tx b {
          color: #f2d999;
        }
        .step .tx small {
          display: block;
          margin-top: 6px;
          font: 500 28px/1.4 "Noto Serif SC", serif;
          color: rgba(243, 238, 227, 0.7);
        }
        #s-cav {
          position: absolute;
          left: 860px;
          top: 720px;
          width: 860px;
          padding: 18px 26px;
          border: 1.5px solid rgba(111, 124, 153, 0.6);
          border-radius: 12px;
          background: rgba(12, 15, 30, 0.75);
          opacity: 0;
        }
        #s-cav .t {
          font: 500 28px/1.4 "Noto Serif SC", serif;
          color: rgba(201, 207, 223, 0.95);
        }
        #s-cav .c {
          margin-top: 6px;
          font: italic 500 19px/1 "Cormorant Garamond", serif;
          letter-spacing: 0.03em;
          color: rgba(201, 207, 223, 0.55);
        }
      </style>

      <div id="sc10-root" data-composition-id="sc10" data-width="1920" data-height="1080">
        <div id="sc10-all">
          <div class="name-card" id="s-name">
            <div class="zh">一把筛子</div>
            <div class="en"><i></i><span>A SIEVE, NOT A VERDICT</span><i></i></div>
          </div>
          <canvas id="s-rain" width="480" height="760"></canvas>
          <div id="s-sieve"><svg id="s-mesh" viewBox="0 0 480 480" aria-hidden="true"></svg></div>
          <div id="s-list">
            <div class="step" id="st-1"><span class="no">1</span><div class="tx">数据要跨越好几个数量级</div></div>
            <div class="step" id="st-2"><span class="no">2</span><div class="tx">数一数首位是 <b>1</b> 的有多少</div></div>
            <div class="step" id="st-3"><span class="no">3</span><div class="tx">接近 <b>三成</b>，像是真的<small>1 到 9 差不多一样多？值得多看一眼</small></div></div>
          </div>
          <div id="s-cav"><div class="t">反例：麦道夫编造的投资收益，首位分布却很正常。</div><div class="c">Tim Harford, "Look out for No. 1", Financial Times, 2011</div></div>
        </div>
      </div>

      <script>
        (function () {
          const T = 60 / 102.4;
          const B0 = 224;
          const at = (b) => (b - B0) * T;
          const prand = (n) => {
            const x = Math.sin(n * 127.1 + 311.7) * 43758.5453;
            return x - Math.floor(x);
          };
          // 筛网：圆 + 斜交网格（裁在圆里）
          const R = 220, C = 240;
          let g = '<defs><clipPath id="s-clip"><circle cx="240" cy="240" r="220" /></clipPath></defs><g clip-path="url(#s-clip)">';
          for (let k = -12; k <= 12; k++) {
            const o = k * 34;
            g += '<line x1="' + (C + o - 400) + '" y1="' + (C - 400) + '" x2="' + (C + o + 400) + '" y2="' + (C + 400) + '" />';
            g += '<line x1="' + (C + o + 400) + '" y1="' + (C - 400) + '" x2="' + (C + o - 400) + '" y2="' + (C + 400) + '" />';
          }
          g += '</g><circle cx="240" cy="240" r="' + R + '" />';
          document.getElementById("s-mesh").innerHTML = g;
          // 数字从上面落下、穿过筛网（纯函数）
          const cv = document.getElementById("s-rain");
          const ctx = cv.getContext("2d");
          const NR = 46;
          const RAIN = [];
          for (let i = 0; i < NR; i++) {
            RAIN.push({ x: 40 + prand(i * 3.1) * 400, v: 70 + prand(i * 4.7) * 80, y0: prand(i * 6.3) * 760, d: String(1 + Math.floor(prand(i * 8.9) * 9)), s: 18 + prand(i * 2.2) * 16 });
          }
          function draw(t) {
            ctx.clearRect(0, 0, 480, 760);
            ctx.textAlign = "center";
            for (const p of RAIN) {
              const y = (p.y0 + p.v * t) % 760;
              const fade = Math.min(1, y / 80, (760 - y) / 120);
              ctx.globalAlpha = 0.5 * Math.max(0, fade);
              ctx.fillStyle = p.d === "1" ? "#f2d999" : "#c9cfdf";
              ctx.font = "italic 500 " + p.s.toFixed(0) + 'px "Cormorant Garamond", serif';
              ctx.fillText(p.d, p.x, y);
            }
            ctx.globalAlpha = 1;
          }

          const tl = gsap.timeline({ paused: true });
          const SCENE = at(240) + 0.4;
          const drive = { t: 0 };
          tl.to(drive, { t: SCENE, duration: SCENE, ease: "none", onUpdate: () => draw(drive.t) }, 0);
          tl.fromTo("#s-name", { opacity: 0, y: 14, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.9, ease: "power3.out" }, 0.1);
          tl.fromTo("#s-sieve", { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.9, ease: "power3.out" }, 0.3);
          tl.fromTo("#s-mesh", { rotation: 0 }, { rotation: 24, duration: SCENE, ease: "none" }, 0);
          [225, 226.5, 228].forEach((b, k) => {
            tl.fromTo("#st-" + (k + 1), { opacity: 0, x: 24, filter: "blur(6px)" }, { opacity: 1, x: 0, filter: "blur(0px)", duration: 0.7, ease: "power3.out" }, at(b));
          });
          tl.fromTo("#s-cav", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" }, at(232));
          tl.to("#sc10-all", { opacity: 0, filter: "blur(10px)", duration: 0.45, ease: "power2.in" }, at(240) - 0.05);
          draw(0);
          window.__timelines["sc10"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
