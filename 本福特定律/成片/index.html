  <body>
    <!--
      偏心的数字（本福特定律）· Vibe知识大赏
      配乐降速到 0.8 倍：102.4 BPM，1 拍 = 0.5859375 秒，1 小节 = 2.34375 秒。全片第 n 拍（从 0 数）起点 = n × 0.5859375 秒。
      每屏一个子合成，在小节第 1 拍切换，前后重叠 0.4 秒做溶解。详细分镜见 ../分镜.md。
    -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="157.5" data-width="1920" data-height="1080">

      <div id="bg" data-composition-id="bg" data-composition-src="compositions/bg.html" data-start="0" data-duration="157.5" data-track-index="0" data-width="1920" data-height="1080"></div>

      <!-- S1–S2 冷开场 + 心里作答 Q1：全片第 0–32 拍 -->
      <div id="sc01" data-composition-id="sc01" data-composition-src="compositions/sc01.html" data-start="0.000000" data-duration="19.150000" data-track-index="1" data-width="1920" data-height="1080"></div>
      <!-- S3 片名：全片第 32–40 拍 -->
      <div id="sc02" data-composition-id="sc02" data-composition-src="compositions/sc02.html" data-start="18.750000" data-duration="5.087500" data-track-index="2" data-width="1920" data-height="1080"></div>
      <!-- S4 1881 纽康的对数表：全片第 40–64 拍 -->
      <div id="sc03" data-composition-id="sc03" data-composition-src="compositions/sc03.html" data-start="23.437500" data-duration="14.462500" data-track-index="1" data-width="1920" data-height="1080"></div>
      <!-- S5 1938 本福特 + 揭晓 30.1%：全片第 64–96 拍 -->
      <div id="sc04" data-composition-id="sc04" data-composition-src="compositions/sc04.html" data-start="37.500000" data-duration="19.150000" data-track-index="2" data-width="1920" data-height="1080"></div>
      <!-- S6 乘法的世界：全片第 96–128 拍 -->
      <div id="sc05" data-composition-id="sc05" data-composition-src="compositions/sc05.html" data-start="56.250000" data-duration="19.150000" data-track-index="1" data-width="1920" data-height="1080"></div>
      <!-- S7 对数尺 + 2 的幂：全片第 128–160 拍 -->

      <div id="sc07" data-composition-id="sc07" data-composition-src="compositions/sc07.html" data-start="93.750000" data-duration="9.775000" data-track-index="1" data-width="1920" data-height="1080"></div>
      <!-- S9 217 个国家和地区：全片第 176–192 拍 -->
      <div id="sc08" data-composition-id="sc08" data-composition-src="compositions/sc08.html" data-start="103.125000" data-duration="9.775000" data-track-index="2" data-width="1920" data-height="1080"></div>
      <!-- S10 数字指纹：全片第 192–224 拍 -->
      <div id="sc09" data-composition-id="sc09" data-composition-src="compositions/sc09.html" data-start="112.500000" data-duration="19.150000" data-track-index="1" data-width="1920" data-height="1080"></div>

      <div id="hud" data-composition-id="hud" data-composition-src="compositions/hud.html" data-start="0" data-duration="157.5" data-track-index="5" data-width="1920" data-height="1080"></div>
