        <div id="y-scrim"></div>
        <div id="y-block">
          <div id="y-year">1881</div>
          <div id="y-who">天文学家 西蒙·纽康</div>
          <div id="y-en">SIMON NEWCOMB · ASTRONOMER</div>
        </div>
        <div id="y-main">越靠前的页，<span class="gold">越脏</span></div>

        <div id="y-meter"></div>
        <div id="y-meter-lab"><span>← 1 开头的页 · 最脏</span><span>9 开头的页 · 最干净 →</span></div>
        <div id="y-note">人们要查的数，更多以 <span class="gold">1</span>、<span class="gold">2</span> 开头</div>

        </div>

      <script>
        (function () {
          const T = 60 / 102.4;
          const B0 = 40;
          const at = (b) => (b - B0) * T;
          const benford = [30.1, 17.6, 12.5, 9.7, 7.9, 6.7, 5.8, 5.1, 4.6];
          // 九页对数表：第 d 页从 N = d·100 开始，四位尾数（真实的常用对数）
          const fan = document.getElementById("y-fan");
          const meter = document.getElementById("y-meter");
          const STEP = 84;
          for (let d = 1; d <= 9; d++) {
            const pg = document.createElement("div");
            pg.className = "pg";
            pg.id = "pg-" + d;
            let rows = "";
            for (let r = 0; r < 15; r++) {
              const N = d * 100 + r;
              let cells = "<td>" + N + "</td>";
              for (let c = 0; c < 6; c++) {
                const m = Math.log10((N * 10 + c) / 1000) % 1;
                cells += "<td>" + String(Math.round(m * 10000) % 10000).padStart(4, "0") + "</td>";
              }
              rows += "<tr>" + cells + "</tr>";
            }
            pg.innerHTML = '<div class="hd"><span>LOGARITHMS</span><b>' + d + "</b></div><table>" + rows + '</table><div class="grime"></div><div class="edge"></div>';
            const k = d - 1;
            const w = document.createElement("div");
            w.className = "pgw";
            w.style.transform = "translate3d(" + k * STEP + "px," + k * -6 + "px," + -k * 34 + "px) rotateY(-14deg)";
            w.style.zIndex = String(20 - d);
            w.appendChild(pg);
            fan.appendChild(w);
            const wm = document.createElement("div");
            wm.className = "wm";
            wm.style.left = 165 + k * STEP + "px";
            wm.innerHTML = '<i style="height:' + Math.round(benford[k] * 1.9 + 6) + 'px"></i><b>' + d + "</b>";
            meter.appendChild(wm);
          }

          const tl = gsap.timeline({ paused: true });
          // 镜头：整组慢慢转过来、推近
          tl.fromTo("#y-fan", { rotationY: -17, rotationX: 8, x: 24, y: 8, scale: 0.95 }, { rotationY: -8, rotationX: 4, x: -10, y: 0, scale: 1.02, duration: at(64) + 0.4, ease: "sine.inOut" }, 0);
          // 开场 2 秒：AI 生成的书房照片——摊开的对数表，前几页翻得发黑；书页飞进来时照片退成背景
          tl.fromTo("#y-photo", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.out" }, 0);
          tl.fromTo("#y-photo", { scale: 1.0 }, { scale: 1.07, duration: at(64) + 0.4, ease: "none" }, 0);
          tl.to("#y-photo", { opacity: 0.26, duration: 1.4, ease: "power2.inOut" }, at(42.5));
          tl.fromTo("#y-block", { opacity: 0, x: -24, filter: "blur(10px)" }, { opacity: 1, x: 0, filter: "blur(0px)", duration: 0.9, ease: "power3.out" }, 0.1);
          for (let d = 1; d <= 9; d++) {
            tl.fromTo("#pg-" + d, { opacity: 0, z: -400 }, { opacity: 1, z: 0, duration: 0.8, ease: "power3.out" }, at(43) + (d - 1) * 0.22);
          }
          tl.fromTo("#y-main", { opacity: 0, y: 16, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.8, ease: "power3.out" }, at(46));
          // 磨损按本福特比例出现：第 1 页最脏
          for (let d = 1; d <= 9; d++) {
            const lvl = 0.14 + (benford[d - 1] / 30.1) * 0.8;
            tl.to("#pg-" + d + " .grime", { opacity: lvl, duration: 1.4, ease: "power2.out" }, at(48) + (d - 1) * 0.12);
            tl.to("#pg-" + d + " .edge", { opacity: lvl, duration: 1.4, ease: "power2.out" }, at(48) + (d - 1) * 0.12);
          }
          tl.to("#y-meter", { opacity: 1, duration: 0.5, ease: "power2.out" }, at(50));
          tl.fromTo("#y-meter .wm i", { scaleY: 0 }, { scaleY: 1, duration: 0.9, ease: "power3.out", stagger: 0.08 }, at(50));
          tl.fromTo("#y-meter-lab", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.out" }, at(51));
          tl.fromTo("#y-note", { opacity: 0, y: 14, filter: "blur(6px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.8, ease: "power3.out" }, at(54));
          tl.fromTo("#y-stamp", { opacity: 0, scale: 1.2 }, { opacity: 1, scale: 1, duration: 0.35, ease: "power2.out" }, at(56));
          // 离场
          tl.to("#sc03-all", { opacity: 0, filter: "blur(10px)", duration: 0.45, ease: "power2.in" }, at(64) - 0.05);
          window.__timelines["sc03"] = tl;
        })();
      </script>
