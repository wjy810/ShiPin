          const BEN = [30.1, 17.6, 12.5, 9.7, 7.9, 6.7, 5.8, 5.1, 4.6];
          const X0 = 260, PXD = 200; // 10^3 在 x 260，每个数量级 200px
          const axis = document.getElementById("p-axis");

          // 每个点：散点位置 → 直方图位置（每列 4 个一排）
          const COLX = (d) => 560 + (d - 1) * 100;
          const BASE = 802;
          const seen = [0, 0, 0, 0, 0, 0, 0, 0, 0];
          const DOTS = POP.map((p, i) => {
            const d = +String(p)[0];
            const k = seen[d - 1]++;
            return {
              d,
              sx: X0 + (Math.log10(p) - 3) * PXD,
              sy: 400 + (prand(i * 3.3) - 0.5) * 120,
              tx: COLX(d) - 16.5 + (k % 4) * 11,
              ty: BASE - 7 - Math.floor(k / 4) * 11,
              delay: prand(i * 5.9) * 0.9,
            };
          });
          const cols = document.getElementById("p-cols");
          for (let d = 1; d <= 9; d++) {
            const lab = document.createElement("div");
            lab.className = "p-d";
            lab.style.left = COLX(d) + "px";
            lab.textContent = d;

            const n = seen[d - 1];
            const top = BASE - Math.ceil(n / 4) * 11;
            const c = document.createElement("div");
            c.className = "p-n";
            c.style.left = COLX(d) + "px";

            c.textContent = n;

            e.style.left = COLX(d) + "px";
            e.style.top = (BASE - ((217 * BEN[d - 1]) / 100 / 4) * 11).toFixed(1) + "px";
            cols.appendChild(e);
          }
          const cv = document.getElementById("p-cv");
          const ctx = cv.getContext("2d");
          const SHOW = at(177), FALL = at(180.5);
          function draw(t) {
            ctx.clearRect(0, 0, 1920, 1080);
            for (let i = 0; i < DOTS.length; i++) {
              const p = DOTS[i];
              const appear = clamp((t - SHOW - (p.sx - X0) / 1400 * 1.4) / 0.35, 0, 1);
              if (appear <= 0) continue;
              const u = ease3(clamp((t - FALL - p.delay) / 1.3, 0, 1));
              const x = p.sx + (p.tx - p.sx) * u;
              const y = p.sy + (p.ty - p.sy) * u - Math.sin(u * Math.PI) * 60;
              ctx.globalAlpha = appear * (p.d === 1 ? 1 : 0.62);
              ctx.fillStyle = p.d === 1 ? "#f2d999" : "#c9cfdf";
              if (p.d === 1) {
                ctx.shadowColor = "rgba(216,180,106,0.8)";
                ctx.shadowBlur = 8;
              }
              ctx.beginPath();
              ctx.arc(x, y, 4.6, 0, Math.PI * 2);
              ctx.fill();
              ctx.shadowBlur = 0;
            }
            ctx.globalAlpha = 1;
          }

          const SCENE = at(192) + 0.4;
