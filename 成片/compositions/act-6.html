      <script>
        (function () {
          const T = 60 / 128;
          const F = 1 / 30;
          const B0 = 150; // 本幕第一拍（重低音段第一拍）
          const END = 198; // 下半页从这一拍反向推回来
          const at = (b) => (b - B0) * T;
          const tl = gsap.timeline({ paused: true });
          const RUST = "#9a3412";
          const LEAD = "#635d53";
          const drop = (sel, t, dy = 60, f = 6) => {
            tl.set(sel, { opacity: 1 }, t);
            tl.fromTo(sel, { y: dy }, { y: 0, duration: f * F, ease: "power4.out" }, t);
          };
          const draw = (el, t, dur) => {
            const list = typeof el === "string" ? document.querySelectorAll(el) : [el];
            list.forEach((p) => {
              const len = p.getTotalLength();
              p.style.strokeDasharray = `${len}`;
              tl.set(p, { visibility: "visible" }, t);
              tl.fromTo(p, { strokeDashoffset: len }, { strokeDashoffset: 0, duration: dur, ease: "none" }, t);
            });
          };
          const pop = (sel, b, f = 10) => {
            tl.set(sel, { opacity: 1 }, at(b));
            tl.fromTo(sel, { scale: 0, y: 12 }, { scale: 1, y: 0, duration: f * F, ease: "power3.out" }, at(b));
          };
          const tapes = (sel, b) =>
            tl.fromTo(sel, { scaleX: 0 }, { scaleX: 1, duration: 7 * F, ease: "power3.out", stagger: 2 * F }, at(b));
          const stamp = (sel, b) => {
            tl.set(sel, { opacity: 1 }, at(b));
            tl.fromTo(sel, { scale: 1.35, rotation: -4 }, { scale: 1, rotation: -4, duration: 4 * F, ease: "power2.out" }, at(b));
          };
          const flick = (sel, b, dir = 1) => {
            tl.to(sel, { y: -80, rotation: 5 * dir, duration: 6 * F, ease: "power2.in" }, at(b));
            tl.set(sel, { opacity: 0 }, at(b) + 5 * F);
          };

          // —— 推页入场（第 150 拍，重低音段第一拍） ——
          tl.fromTo("#a6-pageA", { x: 1920 }, { x: 0, duration: 8 * F, ease: "power4.out" }, 0);

          // —— 屏 22（第 150–157 拍）：时间大字；第 154 拍 8 个剪影同时出现，之后每半拍变灰一个 ——
          drop("#a6-w1", at(150), 90, 8);
          const beasts = gsap.utils.toArray("#act-6 .beast");
          beasts.forEach((el, i) => {
            tl.set(el, { opacity: 1 }, at(154));
            tl.fromTo(el, { y: 24 }, { y: 0, duration: 6 * F, ease: "power3.out" }, at(154));
            tl.set(el.querySelector("path"), { stroke: LEAD }, at(154.5 + 0.5 * i));
          });
          stamp("#a6-stamp22", 156);

          // —— 屏 23（第 158–165 拍）：文字卡，锈红方框框住「1980年」 ——
          tl.set(["#a6-s22", "#a6-stamp22"], { opacity: 0 }, at(158));
          beasts.forEach((el) => tl.set(el, { opacity: 0 }, at(158)));
          drop("#a6-w2", at(158), 70);
          drop("#a6-w3", at(158) + 3 * F, 70);
          draw("#a6-box", at(160), T);

          // —— 屏 24（第 166–171 拍）：界线露头竖幅照片；方括号标出那一层的高度（画在照片外） ——
          tl.set("#a6-s23", { opacity: 0 }, at(166));
          drop("#a6-w4", at(166));
          pop("#a6-card24", 166);
          tapes(".a6-tape24", 166.5);
          draw("#a6-bracket", at(168), T);

          // —— 屏 25（第 172–181 拍）：推近界线；三根柱子一拍一根猛涨 ——
          tl.set("#a6-s24", { opacity: 0 }, at(172));
          drop("#a6-w5", at(172));
          drop("#a6-w6", at(172) + 3 * F);
          tl.fromTo("#a6-gzoom", { scale: 1 }, { scale: 1.5, duration: 2 * T, ease: "power3.inOut" }, at(172));

          tl.set(["#a6-s25", "#a6-stamp25", "#a6-bracket"], { opacity: 0 }, at(182));

          tl.set("#a6-rock", { opacity: 0 }, at(184));
          tl.to("#a6-card26", { y: 10, duration: 1 * F, ease: "none" }, at(184));
          tl.to("#a6-card26", { y: -8, duration: 1 * F, ease: "none" }, at(184) + 1 * F);

          tl.to("#a6-pageA", { x: 1920, duration: 8 * F, ease: "power4.out" }, at(198));
