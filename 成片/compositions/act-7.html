  <body>
    <template>
      <style>
        @font-face {
          font-family: "Noto Serif SC";

          font-weight: 200 900;
          font-display: block;
        }
        @font-face {
          font-family: "Noto Serif SC";
          src: url("assets/fonts/NotoSerifSC-extra-1.woff2") format("woff2");
          font-weight: 200 900;
          unicode-range: U+539F, U+590D, U+793A;
          font-display: block;
        }
        @font-face {
          font-family: "Noto Serif SC";
          src: url("assets/fonts/NotoSerifSC-extra-2.woff2") format("woff2");
          font-weight: 200 900;
          unicode-range: U+610F;
          font-display: block;
        }
        #act-7 {
          --paper: #f1ebdd;
          --ink: #23201a;
          --rust: #9a3412;
          --card: #fbf8f1;
          --tape: rgba(216, 195, 154, 0.88);
          position: absolute;
          inset: 0;
          overflow: hidden;
          font-family: "Noto Serif SC", serif;
          color: var(--ink);
        }
        #act-7 * {
          margin: 0;
          padding: 0;
          box-sizing: border-box;
        }
        #act-7 .page {
          position: absolute;
          inset: 0;
          overflow: hidden;
          background: var(--paper);
          box-shadow: 0 30px 80px rgba(35, 32, 26, 0.35);
          transform-origin: 50% 50%;
        }
        #act-7 .ruled {
          position: absolute;
          inset: 0;
          background-image: repeating-linear-gradient(
            to bottom,
            transparent 0,
            transparent 53px,
            rgba(35, 32, 26, 0.13) 53px,
            rgba(35, 32, 26, 0.13) 55px
          );
        }
        #act-7 .grain {
          position: absolute;
          inset: 0;
          background-image: url("assets/images/paper-grain.png");
        }
        #act-7 .holes {
          position: absolute;
          left: 34px;
          top: 0;
          bottom: 0;
          display: flex;
          flex-direction: column;
          justify-content: space-around;
          padding: 150px 0;
        }
        #act-7 .holes i {
          display: block;
          width: 38px;
          height: 38px;
          border-radius: 50%;
          background: #d9d1bf;
          box-shadow: inset 0 3px 6px rgba(35, 32, 26, 0.35);
        }
        #act-7 .tilt {
          position: absolute;
          left: 120px;
          top: 112px;
          width: 840px;
          transform: rotate(-2deg);
        }
        #act-7 .card {
          display: block;
          width: 100%;
          padding: 20px;
          background: var(--card);
          box-shadow: 0 18px 44px rgba(35, 32, 26, 0.28);
          opacity: 0;
        }
        #act-7 .frame {
          position: relative;
          display: block;
          width: 800px;
          height: 450px;
          overflow: hidden;
        }
        #act-7 .frame img {
          display: block;
          width: 100%;
          height: 100%;
          object-fit: cover;
        }
        #act-7 .tape {
          position: absolute;
          top: -22px;
          width: 160px;
          height: 44px;
        }
        #act-7 .tape.left {
          left: 40px;
          transform: rotate(-7deg);
        }
        #act-7 .tape.right {
          right: 40px;
          transform: rotate(6deg);
        }
        #act-7 .tape i {
          display: block;
          width: 100%;
          height: 100%;
          background: var(--tape);
          transform-origin: 0% 50%;
        }
        #act-7 .say {
          position: absolute;
          left: 120px;
          bottom: 118px;
          font-size: 96px;
          font-weight: 900;
          line-height: 1.2;
          letter-spacing: -0.02em;
        }
        #act-7 .line {
          display: block;
          white-space: nowrap;
        }
        #act-7 .w {
          display: inline-block;
          opacity: 0;
        }
        #act-7 .rust {
          color: var(--rust);
        }
        #act-7 .when {
          font-size: 120px;
          line-height: 1.15;
        }
        #act-7 .when small {
          font-size: 80px;
          color: var(--ink);
        }
        #act-7 svg.ink {
          position: absolute;
          overflow: visible;
        }
        #act-7 svg.ink path {
          visibility: hidden;
          fill: none;
          stroke-linecap: round;
          stroke-linejoin: round;
        }
        #act-7 .stamp {
          position: absolute;
          padding: 6px 16px;
          border: 4px solid var(--rust);
          color: var(--rust);
          font-size: 40px;
          font-weight: 900;
          line-height: 1.1;
          letter-spacing: 0.06em;
          background: rgba(251, 248, 241, 0.85);
          opacity: 0;
        }
        /* 复原图：multiply 叠在纸上，白底变成纸色，不抠图 */
        #act-7 #a7-skull {
          position: absolute;
          left: 1100px;
          top: 130px;
          width: 505px;
          height: 537px;
          mix-blend-mode: multiply;
          opacity: 0;
        }
        #act-7 #a7-round {
          position: absolute;
          left: 1050px;
          top: 250px;
          width: 540px;
          height: 540px;
          border-radius: 50%;
          overflow: hidden;
          opacity: 0;
        }
        #act-7 #a7-round img {
          display: block;
          width: 100%;
          height: 100%;
          object-fit: cover;
        }
        #act-7 #a7-round-tape {
          position: absolute;
          left: 1430px;
          top: 260px;
          width: 150px;
          height: 44px;
          transform: rotate(36deg);
        }
        #act-7 #a7-round-tape i {
          display: block;
          width: 100%;
          height: 100%;
          background: var(--tape);
          transform-origin: 0% 50%;
        }
        /* 问号：和覆盖层那枚同形同大，屏 35 落位后由它接手 */
        #act-7 #a7-q {
          position: absolute;
          left: 894.68px;
          top: 554.4px;
          width: 51.84px;
          height: 86.4px;
          opacity: 0;
        }
      </style>

      <div id="act-7" data-composition-id="act-7" data-width="1920" data-height="1080">
        <!-- ===================== 屏 32–34 ===================== -->
        <div class="page" id="a7-pageA">
          <div class="ruled"></div>
          <div class="grain"></div>
          <div class="holes" aria-hidden="true"><i></i><i></i><i></i></div>

          <!-- 屏 32：杰贝尔依罗发掘现场，Irhoud 10 出土原位（Steffen Schatz, MPI EVA Leipzig，CC BY-SA 2.0），保留比例尺 -->
          <div class="tilt">
            <div class="card" id="a7-card32">
              <div class="frame"><img id="a7-irhoud" src="assets/images/irhoud10-print.jpg" alt="" /></div>
              <div class="tape left"><i class="a7-tape32"></i></div>
              <div class="tape right"><i class="a7-tape32"></i></div>
            </div>
          </div>

          <!-- 屏 33：早期智人头骨复原图（Philipp Gunz, MPI EVA Leipzig，CC BY-SA 2.0） -->
          <img id="a7-skull" src="assets/images/skull-crop.jpg" alt="" />
          <div class="stamp" id="a7-stamp33" style="left: 1450px; top: 112px">复原图</div>

          <!-- 屏 34：钟变回一层层岩石之后，留在纸上的圆形贴片（叠层石，复用） -->
          <div id="a7-round"><img src="assets/images/strelley-print.jpg" alt="" /></div>
          <div id="a7-round-tape"><i id="a7-round-tape-i"></i></div>

          <!-- 屏 32 -->
          <h2 class="say when" id="a7-s32">
            <span class="line"><span class="w" id="a7-w1"><span class="rust">最后8秒</span><small>｜约31.5万年前</small></span></span>
          </h2>
          <!-- 屏 33 -->
          <h2 class="say" id="a7-s33">
            <span class="line"><span class="w" id="a7-w2">早期智人：脸已接近现代人，</span></span>
            <span class="line"><span class="w" id="a7-w3">接近你我</span></span>
          </h2>
          <!-- 屏 34 -->
          <h2 class="say" id="a7-s34" style="font-size: 88px">
            <span class="line"><span class="w" id="a7-w4">这一整天，</span></span>
            <span class="line"><span class="w" id="a7-w5">都是人们从石头里读出来的</span></span>
          </h2>
        </div>

        <!-- ===================== 屏 35–36：空白的新页 ===================== -->
        <div class="page" id="a7-pageB" style="opacity: 0">
          <div class="ruled"></div>
          <div class="grain"></div>
          <div class="holes" aria-hidden="true"><i></i><i></i><i></i></div>

          <div id="a7-s35wrap" style="position: absolute; inset: 0">
            <!-- 屏 35：左对齐，放在画面中线高度，四周留白 -->
            <h2 class="say" id="a7-s35" style="top: 425px; bottom: auto">
              <span class="line"><span class="w" id="a7-w6">下次听到“定论”，</span></span>
              <span class="line"><span class="w" id="a7-w7">多问一句：<span class="rust">证据呢</span></span></span>
            </h2>
            <svg id="a7-q" viewBox="0 0 120 200" aria-hidden="true">
              <path d="M 24 62 C 22 22, 98 12, 98 58 C 98 94, 60 96, 60 136" style="fill: none; stroke: var(--rust); stroke-width: 16; stroke-linecap: round; stroke-linejoin: round" />
              <circle cx="60" cy="178" r="11" style="fill: var(--rust)" />
            </svg>
            <svg class="ink" style="left: 584px; top: 650px; width: 360px; height: 40px" viewBox="0 0 360 40" aria-hidden="true">
              <path id="a7-ul" d="M 6 22 C 100 12, 220 30, 354 18" style="stroke: var(--rust); stroke-width: 9" />
            </svg>
          </div>
          <!-- 屏 36 -->
          <h2 class="say" id="a7-s36" style="font-size: 72px">
            <span class="line"><span class="w" id="a7-w8">资料来源见简介</span></span>
          </h2>
        </div>
      </div>

      <script>
        (function () {
          const T = 60 / 128;
          const F = 1 / 30;
          const B0 = 230; // 本幕第一拍（尾声第一拍）
          const at = (b) => (b - B0) * T;
          const tl = gsap.timeline({ paused: true });
          const drop = (sel, t, dy = 60, f = 6) => {
            tl.set(sel, { opacity: 1 }, t);
            tl.fromTo(sel, { y: dy }, { y: 0, duration: f * F, ease: "power4.out" }, t);
          };
          const draw = (sel, t, dur) => {
            const p = document.querySelector(sel);
            const len = p.getTotalLength();
            p.style.strokeDasharray = `${len}`;
            tl.set(p, { visibility: "visible" }, t);
            tl.fromTo(p, { strokeDashoffset: len }, { strokeDashoffset: 0, duration: dur, ease: "none" }, t);
          };

          // —— 推页入场（第 230 拍，尾声；12 帧，比平时慢） ——
          tl.fromTo("#a7-pageA", { x: 1920 }, { x: 0, duration: 12 * F, ease: "power4.out" }, 0);

          // —— 屏 32（第 230–237 拍）：发掘现场照片在左上，钟在右侧走完最后 8 秒（覆盖层） ——
          tl.set("#a7-card32", { opacity: 1 }, at(230));
          tl.fromTo("#a7-card32", { scale: 0, y: 12 }, { scale: 1, y: 0, duration: 12 * F, ease: "power3.out" }, at(230));
          tl.fromTo(".a7-tape32", { scaleX: 0 }, { scaleX: 1, duration: 7 * F, ease: "power3.out", stagger: 2 * F }, at(230.5));
          // 原图说明里头骨在画面中央：向中央缓慢推近，不画圈（无法确认具体是哪一块）
          tl.fromTo("#a7-irhoud", { scale: 1 }, { scale: 1.12, duration: 8 * T, ease: "none" }, at(230));
          drop("#a7-w1", at(230), 90, 8);

          // —— 屏 33（第 238–245 拍）：复原图落下，第 240 拍盖「复原图」章 ——
          tl.set("#a7-s32", { opacity: 0 }, at(238));
          tl.to("#a7-card32", { y: -80, rotation: -5, duration: 6 * F, ease: "power2.in" }, at(238));
          tl.set("#a7-card32", { opacity: 0 }, at(238) + 5 * F);
          tl.set("#a7-skull", { opacity: 1 }, at(238));
          tl.fromTo("#a7-skull", { y: 30, scale: 0.96 }, { y: 0, scale: 1, duration: 10 * F, ease: "power3.out" }, at(238));
          drop("#a7-w2", at(238));
          drop("#a7-w3", at(238) + 3 * F);
          tl.set("#a7-stamp33", { opacity: 1 }, at(240));
          tl.fromTo("#a7-stamp33", { scale: 1.35, rotation: -4 }, { scale: 1, rotation: -4, duration: 4 * F, ease: "power2.out" }, at(240));

          // —— 屏 34（第 246–253 拍）：钟飞来、变成叠层石（覆盖层）；第 250 拍由纸上的圆形贴片接手，整页拉远 ——
          tl.set(["#a7-s33", "#a7-stamp33"], { opacity: 0 }, at(246));
          tl.to("#a7-skull", { y: -80, duration: 6 * F, ease: "power2.in" }, at(246));
          tl.set("#a7-skull", { opacity: 0 }, at(246) + 5 * F);
          drop("#a7-w4", at(246));
          drop("#a7-w5", at(246) + 3 * F);
          tl.set("#a7-round", { opacity: 1 }, at(250));
          tl.fromTo("#a7-round-tape-i", { scaleX: 0 }, { scaleX: 1, duration: 7 * F, ease: "power3.out" }, at(250.5));
          tl.fromTo("#a7-pageA", { scale: 1 }, { scale: 0.85, duration: 4 * T, ease: "power1.inOut" }, at(250));

          // —— 屏 35（第 254–263 拍）：空白的新页；第 258 拍问号飞来（覆盖层），落位后由这一枚接手 ——
          tl.to("#a7-pageA", { x: -1920, duration: 12 * F, ease: "power4.out" }, at(254));
          tl.set("#a7-pageB", { opacity: 1 }, at(254));
          tl.fromTo("#a7-pageB", { x: 1920 }, { x: 0, duration: 12 * F, ease: "power4.out" }, at(254));
          drop("#a7-w6", at(254));
          drop("#a7-w7", at(254) + 3 * F);
          tl.set("#a7-q", { opacity: 1 }, at(258) + 10 * F);
          draw("#a7-ul", at(260), T);

          // —— 屏 36（第 264–269 拍）：上一屏的字收走，资料来源；配乐在本屏淡完 ——
          tl.to("#a7-s35wrap", { y: -90, opacity: 0, duration: 8 * F, ease: "power2.in" }, at(264));
          drop("#a7-w8", at(264));

          window.__timelines["act-7"] = tl;
        })();
      </script>
    </template>
  </body>
