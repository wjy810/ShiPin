        (function () {
          const T = 60 / 128;
          const F = 1 / 30;
          const B0 = 46; // 本幕第一拍
          const END = 86; // 第 4 幕从这一拍推页进来
          const at = (b) => (b - B0) * T;
          const tl = gsap.timeline({ paused: true });
          const LEAD = "#635d53";
          const drop = (sel, t, dy = 60, f = 6) => {
            tl.set(sel, { opacity: 1 }, t);
            tl.fromTo(sel, { y: dy }, { y: 0, duration: f * F, ease: "power4.out" }, t);
          };
          const draw = (sel, b, beats = 1) => {
            document.querySelectorAll(sel).forEach((p) => {
              const len = p.getTotalLength();
              p.style.strokeDasharray = `${len}`;
              tl.set(p, { visibility: "visible" }, at(b));
              tl.fromTo(p, { strokeDashoffset: len }, { strokeDashoffset: 0, duration: beats * T, ease: "none" }, at(b));
            });
          };
          const pop = (sel, b, f = 10) => {
            tl.set(sel, { opacity: 1 }, at(b));
            tl.fromTo(sel, { scale: 0, y: 12 }, { scale: 1, y: 0, duration: f * F, ease: "power3.out" }, at(b));
          };
          const tapes = (sel, b) =>
            tl.fromTo(sel, { scaleX: 0 }, { scaleX: 1, duration: 7 * F, ease: "power3.out", stagger: 2 * F }, at(b));
          const flick = (sel, b, dir = 1) => {
            tl.to(sel, { y: -80, rotation: 5 * dir, duration: 6 * F, ease: "power2.in" }, at(b));
            tl.set(sel, { opacity: 0 }, at(b) + 5 * F);
          };

          // —— 推页入场（第 46 拍） ——
          tl.fromTo("#a3-page", { x: 1920 }, { x: 0, duration: 8 * F, ease: "power4.out" }, 0);

          // —— 屏 7（第 46–53 拍）：叠层石，第 50/51/52 拍各描一条纹层 ——
          pop("#a3-card7", 46);
          tapes(".a3-tape7", 46.5);
          drop("#a3-w1", at(46));
          drop("#a3-w2", at(46) + 3 * F);
          draw(".a3-lam1", 50);
