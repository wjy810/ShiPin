        <!-- 问号（手写笔迹） -->

          <path id="ov-q-hook" d="M 24 62 C 22 22, 98 12, 98 58 C 98 94, 60 96, 60 136" />

      <script>
        (function () {
          const T = 60 / 128; // 1 拍
          const F = 1 / 30; // 1 帧
          const B0 = 32; // 覆盖层从全片第 32 拍（屏 5）开始
          const at = (b) => (b - B0) * T;
          const tl = gsap.timeline({ paused: true });
          const RUST = "#9a3412";
          const LEAD = "#635d53";

          // 钟的三个位置：基准（屏 5–6、34）、右上角常驻、放大到右侧中部
          const BASE = { x: 0, y: 0, scale: 1 };
          const CORNER = { x: 432, y: -352, scale: 144 / 520 };
          const HERO = { x: 80, y: -50, scale: 420 / 520 };
          const moveClock = (pos, b, f = 6, ease = "power3.out") =>
            tl.to("#ov-clock", { ...pos, duration: f * F, ease }, at(b));
          const flash = (b) =>
            tl.fromTo("#ov-tip", { scale: 1 }, { scale: 1.9, duration: 3 * F, ease: "power2.out", yoyo: true, repeat: 1 }, at(b));
          // 指针跳格：每格 3 帧急停
          const step = (to, b) => tl.to("#ov-hand", { rotation: to, duration: 3 * F, ease: "power4.out" }, at(b));

          // —— 屏 5（第 32 拍，高潮第一拍）：时间轴 4 帧横扫全屏 ——
          tl.set("#ov-tlline", { opacity: 1 }, at(32));
          tl.fromTo("#ov-tlline", { clipPath: "inset(0% 100% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 4 * F, ease: "none" }, at(32));
          // 第 34 拍：地球贴片弹出，胶带贴上
          tl.set("#ov-earth", { opacity: 1 }, at(34));
          tl.fromTo("#ov-earth", { scale: 0 }, { scale: 1, duration: 8 * F, ease: "power3.out" }, at(34));
          tl.fromTo("#ov-earth-tape-i", { scaleX: 0 }, { scaleX: 1, duration: 7 * F, ease: "power3.out" }, at(34.5));
          // 第 34.5–38 拍：时间轴被拉进圆里，圆从顶部顺时针画出来（同一缓动、同一时长）
          const ring = document.getElementById("ov-ring");
          const C = ring.getTotalLength();
          ring.style.strokeDasharray = `${C}`;
          tl.set(ring, { visibility: "visible" }, at(34.5));
          tl.fromTo(ring, { strokeDashoffset: C }, { strokeDashoffset: 0, duration: 3.5 * T, ease: "power2.inOut" }, at(34.5));
          tl.fromTo("#ov-tlline", { x: 0 }, { x: 1224, duration: 3.5 * T, ease: "power2.inOut" }, at(34.5));
          // 卷完以后时间轴整条收掉（否则左端那颗锈红点会在裁切边上露出半个）
          tl.set("#ov-tlline", { opacity: 0 }, at(38));

          // —— 屏 6（第 38 拍）：24 根刻度从顶部顺时针依次出现，指针从 0 点走一整圈 ——
          gsap.utils.toArray("#overlay .ov-tick").forEach((el, i) => tl.set(el, { opacity: 1 }, at(38) + (i * T) / 24));
          tl.set(["#ov-hand", "#ov-pin"], { opacity: 1 }, at(38));
          tl.fromTo("#ov-hand", { scaleY: 0, rotation: 0 }, { scaleY: 1, rotation: 0, duration: 6 * F, ease: "power3.out" }, at(38));
          tl.to("#ov-hand", { rotation: 360, duration: 4 * T, ease: "none" }, at(40));
          flash(44);

          // —— 屏 7（第 46 拍）：缩到右上角常驻 ——
          moveClock(CORNER, 46, 8);

          // —— 屏 9（第 62 拍）：放大；第 64–67.5 拍指针逆时针倒走 8 跳，停在 0 点左侧 28.3° ——
          moveClock(HERO, 62);
          for (let k = 1; k <= 8; k++) step(360 - (28.3 * k) / 8, 64 + 0.5 * (k - 1));

          // —— 屏 10（第 68 拍）：骤停。指针褪成铅灰；第 70 拍缩回角落 ——
          tl.to(["#ov-hand", "#ov-tip"], { backgroundColor: LEAD, duration: 2 * T, ease: "none" }, at(68));
          moveClock(CORNER, 70, 8);

          // —— 屏 12：第 81 拍大问号压在灰字上画出；第 82 拍飞到钟下面，常驻 ——
          const hook = document.getElementById("ov-q-hook");
          const H = hook.getTotalLength();
          hook.style.strokeDasharray = `${H}`;
          tl.set(hook, { visibility: "visible" }, at(81));
          tl.fromTo(hook, { strokeDashoffset: H }, { strokeDashoffset: 0, duration: 0.75 * T, ease: "none" }, at(81));
          tl.set("#ov-q-dot", { opacity: 1 }, at(81.75));
          tl.fromTo("#ov-q-dot", { scale: 0, transformOrigin: "60px 178px" }, { scale: 1, duration: 3 * F, ease: "power3.out" }, at(81.75));
          // 问号中心 (736, 490) → 钟下面 (1752, 300)，缩到 0.25
          tl.to("#ov-q", { x: 1016, y: -190, scale: 0.25, duration: 8 * F, ease: "power3.inOut" }, at(82));
          // 第 84 拍指针恢复锈红，越转越快，第 86 拍（第二段高潮第一拍）停在 20:22
          tl.set(["#ov-hand", "#ov-tip"], { backgroundColor: RUST }, at(84));
          tl.to("#ov-hand", { rotation: 360 + 305.6, duration: 2 * T, ease: "power2.in" }, at(84));

          // —— 屏 13（第 86 拍）：放大定格；第 90 拍缩回 ——
          moveClock(HERO, 86);
          flash(86);
          moveClock(CORNER, 90);

          // —— 屏 17（第 114 拍）：每拍跳一格，第 118 拍停在 21:23 ——
          moveClock(HERO, 114);
          [114, 115, 116, 117].forEach((b, k) => step(360 + 305.6 + 3.75 * (k + 1), b));
          flash(118);
          moveClock(CORNER, 120);

          // —— 屏 22（第 150 拍）：每拍沉沉地跳一格，第 154 拍停在 23:32 ——
          moveClock(HERO, 150);
          [150, 151, 152, 153].forEach((b, k) => step(360 + 320.6 + 8.125 * (k + 1), b));
          flash(154);
          moveClock(CORNER, 158);

          // —— 屏 32（第 230 拍）：尾声。放大（慢一点），指针滑到离顶部一丝；放大镜里走完最后 8 秒 ——
          moveClock(HERO, 230, 12);
          tl.to("#ov-hand", { rotation: 360 + 359.967, duration: 1.5 * T, ease: "power2.out" }, at(230));
          const leader = document.getElementById("ov-leader-path");
          const LL = leader.getTotalLength();
          leader.style.strokeDasharray = `${LL}`;
          tl.set(leader, { visibility: "visible" }, at(231.5));
          tl.fromTo(leader, { strokeDashoffset: LL }, { strokeDashoffset: 0, duration: 0.5 * T, ease: "none" }, at(231.5));
          tl.set("#ov-loupe", { opacity: 1 }, at(231.5));
          tl.fromTo("#ov-loupe", { scale: 0.4 }, { scale: 1, duration: 6 * F, ease: "power3.out" }, at(231.5));
          for (let k = 1; k <= 8; k++) tl.to("#ov-needle", { x: 18 * k, duration: 3 * F, ease: "power4.out" }, at(232 + 0.5 * (k - 1)));
          // 第 238 拍（屏 33）：放大镜收掉，钟回角落
          tl.set(["#ov-loupe", leader], { opacity: 0 }, at(238));
          moveClock(CORNER, 238);

          // —— 屏 34（第 246 拍）：钟飞回基准位置；第 248–250 拍叠层石从钟心铺开，盖住地球、刻度和指针 ——
          moveClock(BASE, 246, 8);
          tl.fromTo("#ov-iris", { clipPath: "circle(0% at 50% 50%)" }, { clipPath: "circle(50% at 50% 50%)", duration: 2 * T, ease: "power2.inOut" }, at(248));
          // 第 250 拍交给第 7 幕纸上那张同位置的圆形贴片（它随整页一起拉远）
          tl.set("#ov-clock", { opacity: 0 }, at(250));

          // —— 屏 35（第 258 拍）：问号沿弧线飞进字里，落成「证据呢？」的问号 ——
          // 落点：中心 (920.6, 597.6)，缩放 0.27；第 7 幕在同一位置有一枚一模一样的问号接手
          tl.to("#ov-q", { x: 920.6 - 736, duration: 10 * F, ease: "power3.inOut" }, at(258));
          tl.to("#ov-q", { y: 597.6 - 490, scale: 0.27, duration: 10 * F, ease: "back.in(1.4)" }, at(258));
          tl.set("#ov-q", { opacity: 0 }, at(258) + 10 * F);

          window.__timelines["overlay"] = tl;
        })();
      </script>
