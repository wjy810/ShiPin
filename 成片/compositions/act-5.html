      <script>
        (function () {
          const T = 60 / 128;
          const F = 1 / 30;
          const B0 = 114; // 本幕第一拍
          const END = 150; // 第 6 幕从这一拍推页进来
          const at = (b) => (b - B0) * T;
          const tl = gsap.timeline({ paused: true });
          const drop = (sel, t, dy = 60, f = 6) => {
            tl.set(sel, { opacity: 1 }, t);
            tl.fromTo(sel, { y: dy }, { y: 0, duration: f * F, ease: "power4.out" }, t);
          };
          const draw = (el, t, dur) => {
            const p = typeof el === "string" ? document.querySelector(el) : el;
            const len = p.getTotalLength();
            p.style.strokeDasharray = `${len}`;
            tl.set(p, { visibility: "visible" }, t);
            tl.fromTo(p, { strokeDashoffset: len }, { strokeDashoffset: 0, duration: dur, ease: "none" }, t);
          };
          const stamp = (sel, b) => {
            tl.set(sel, { opacity: 1 }, at(b));
            tl.fromTo(sel, { scale: 1.35, rotation: -4 }, { scale: 1, rotation: -4, duration: 4 * F, ease: "power2.out" }, at(b));
          };

          // —— 推页入场（第 114 拍，滚奏小节第一拍） ——
          tl.fromTo("#a5-page", { x: 1920 }, { x: 0, duration: 8 * F, ease: "power4.out" }, 0);

          // —— 屏 17（第 114–119 拍）：时间大字（钟在覆盖层一拍跳一格） ——
          drop("#a5-w1", at(114), 90, 8);

          // —— 屏 18（第 120–127 拍）：地层从下往上每半拍画一层；第 124 拍圈住第 4 层 ——
          tl.set("#a5-s17", { opacity: 0 }, at(120));
          drop("#a5-w2", at(120));
          drop("#a5-w3", at(120) + 3 * F);
          gsap.utils.toArray("#act-5 .a5-st").forEach((p, i) => draw(p, at(120 + 0.5 * i), 5 * F));
          gsap.utils.toArray("#act-5 .a5-hatch").forEach((p, i) => draw(p, at(121 + 0.5 * i), 6 * F));
          draw("#a5-ring4", at(124), T);
          stamp("#a5-stamp18", 126);

          // —— 屏 19（第 128–133 拍）：地层滑到左上缩小，藏宝图画出，× 两笔，铲子砸下 ——
          tl.set("#a5-s18", { opacity: 0 }, at(128));
          tl.to("#a5-strata", { x: -710, y: -10, scale: 0.42, duration: 8 * F, ease: "power3.inOut" }, at(128));
          drop("#a5-w4", at(128));
          drop("#a5-w5", at(128) + 3 * F);
          draw("#a5-coast", at(128), T);
          tl.set("#a5-route", { visibility: "visible" }, at(129));
          tl.fromTo("#a5-route", { opacity: 0 }, { opacity: 1, duration: 4 * F, ease: "none" }, at(129));
          draw("#a5-x1", at(130), 5 * F);
          draw("#a5-x2", at(130.5), 5 * F);
          tl.set("#a5-shovel", { opacity: 1 }, at(132));
          tl.fromTo("#a5-shovel", { y: -320 }, { y: 0, duration: 4 * F, ease: "power4.in" }, at(132));

          // —— 屏 20（第 134–141 拍）：一铲下去，照片卡从 × 的位置弹出来 ——
          tl.set("#a5-s19", { opacity: 0 }, at(134));
          drop("#a5-w6", at(134));
          drop("#a5-w7", at(134) + 3 * F);
          tl.to("#a5-shovel", { y: 26, rotation: -6, duration: 3 * F, ease: "power3.out" }, at(134));
          tl.to("#a5-shovel", { y: 10, rotation: 4, duration: 3 * F, ease: "power2.inOut" }, at(134) + 3 * F);
          tl.set("#a5-dirt", { opacity: 1 }, at(134.5));
          tl.fromTo("#a5-dirt", { scale: 0.3, y: 30 }, { scale: 1, y: 0, duration: 4 * F, ease: "power3.out" }, at(134.5));
          // 照片卡从 × 里弹出来的同一拍，铲子被抛走
          tl.to("#a5-shovel", { y: -520, rotation: 24, duration: 7 * F, ease: "power2.in" }, at(136));
          tl.set("#a5-shovel", { opacity: 0 }, at(136) + 7 * F);
          tl.set("#a5-card", { opacity: 1 }, at(136));
          tl.fromTo("#a5-card", { scale: 0 }, { scale: 1, duration: 10 * F, ease: "power3.out" }, at(136));
          // 卡片弹满以后把底下的藏宝图和土收掉，免得海岸线从卡片下沿露出一截
          tl.set(["#a5-map", "#a5-dirt"], { opacity: 0 }, at(136) + 10 * F);
          tl.fromTo(".a5-tape", { scaleX: 0 }, { scaleX: 1, duration: 7 * F, ease: "power3.out", stagger: 2 * F }, at(136.5));

          // —— 屏 21（第 142–149 拍）：照片放大移到中间，推近到鳍；第 144 拍圈鳍，第 146 拍划「手腕」 ——
          tl.set(["#a5-s20", "#a5-map", "#a5-shovel", "#a5-dirt", "#a5-strata"], { opacity: 0 }, at(142));
          drop("#a5-w8", at(142));
          drop("#a5-w9", at(142) + 3 * F);
          tl.to("#a5-move", { x: -260, y: -12, scale: 1.25, duration: 2 * T, ease: "power3.inOut" }, at(142));
          tl.fromTo("#a5-zoom", { scale: 1 }, { scale: 1.8, duration: 2 * T, ease: "power3.inOut" }, at(142));
          draw("#a5-fin", at(144), T);
          draw("#a5-fin2", at(144), T);
          draw("#a5-ul", at(146), T);
          tl.to("#a5-zoom", { scale: 1.95, duration: 4 * T, ease: "power1.inOut" }, at(146));

          // —— 推页离场（第 150 拍，重低音段第一拍） ——
          tl.to("#a5-page", { x: -1920, duration: 8 * F, ease: "power4.out" }, at(END));

          window.__timelines["act-5"] = tl;
        })();
      </script>
